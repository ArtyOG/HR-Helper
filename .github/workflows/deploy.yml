name: CD - Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: Build & Publish Container Images
    runs-on: ubuntu-latest
    outputs:
      backend-tag: ${{ steps.meta-backend.outputs.tags }}
      ai-service-tag: ${{ steps.meta-ai.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Backend Image ---
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- AI Service Image ---
      - name: Extract metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ai-service
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Push AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: true
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-database:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: publish-images
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

  deploy-services:
    name: Deploy Services & Verify Health
    runs-on: ubuntu-latest
    needs: [publish-images, migrate-database]
    steps:
      - name: Trigger Server Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering deployment via deploy hook..."
            curl -X POST -f "$DEPLOY_HOOK_URL"
          else
            echo "DEPLOY_HOOK_URL secret not configured. Skipping webhook trigger."
          fi

      - name: Verify Live Server Health
        env:
          LIVE_APP_URL: ${{ secrets.LIVE_APP_URL }}
        run: |
          if [ -n "$LIVE_APP_URL" ]; then
            echo "Waiting for service to be healthy at $LIVE_APP_URL/health..."
            curl -f --retry 10 --retry-delay 5 --retry-connrefused "$LIVE_APP_URL/health"
            echo "Deployment verified healthy!"
          else
            echo "LIVE_APP_URL secret not configured. Skipping live health probe."
          fi
