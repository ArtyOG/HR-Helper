name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Prisma & NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: "mysql://hr_user:hr_password@localhost:3306/hr_helper"
        run: npx prisma validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "mysql://hr_user:hr_password@localhost:3306/hr_helper"
        run: npx prisma generate

      - name: Build NestJS application
        run: npm run build

      - name: Run backend unit tests
        run: npm test

  frontend-ci:
    name: Frontend CI (Vite & React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Vite application
        run: npm run build

  ai-service-ci:
    name: AI Service CI (FastAPI & Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and verify Python syntax
        run: python -m compileall app/

      - name: Test FastAPI app loading & configuration
        run: python -c "from app.main import app; from app.core.config import settings; print('FastAPI app and config loaded successfully')"

  docker-ci:
    name: Docker Builds Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: hr-helper-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: hr-helper-frontend:ci-test

      - name: Build AI Service Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: hr-helper-ai-service:ci-test
