services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hr_helper}
      MYSQL_USER: ${MYSQL_USER:-hr_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hr_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql://hr_user:hr_password@mysql:3306/hr_helper}
      PORT: ${BACKEND_PORT:-3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      JWT_SECRET: ${JWT_SECRET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AI_SERVICE_URL: ${AI_SERVICE_URL}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
      - "5555:5555" # Prisma Studio Port. Run `docker compose exec backend npx prisma studio` to access it.
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && npm run start:dev"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  ai-service:
    build: ./ai-service
    environment:
      PORT: ${AI_SERVICE_PORT:-8000}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-hr-helper}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-your-access-key-id}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-your-secret-access-key}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-your-url-endpoint}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"

volumes:
  mysql_data:
